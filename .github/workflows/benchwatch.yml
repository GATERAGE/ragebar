# Follow the watched models on BenchLM.ai and the Hub. The script exits without
# writing when nothing moved, so a quiet run leaves no commit.
name: benchwatch
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: benchwatch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/benchwatch.mjs
      - name: commit the snapshot if it moved
        run: |
          git add data/
          if git diff --cached --quiet; then echo "nothing moved"; exit 0; fi
          git config user.name  'benchwatch'
          git config user.email 'benchwatch@users.noreply.github.com'
          git commit -m "benchwatch: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
