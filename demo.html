<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ragebar — demo</title>
<link rel="stylesheet" href="src/ragebar.css">
<style>body{background:#05070a;color:#e9ffe9;font-family:ui-monospace,Menlo,monospace;padding:14vh 20px}
h1{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:#3ddc84;text-align:center;margin:0 0 4px}
p.s{font-size:11px;color:#7f9c8a;text-align:center;margin:0 0 22px}</style>
<h1>ragebar</h1>
<p class="s">the search bar that rages while it retrieves</p>
<input id="q" class="ragebar-input" type="search" autocomplete="off" placeholder="type to search the corpus...">
<script src="src/ragebar.js"></script>
<script>
  // Point it at any corpus. This demo targets rage.pythai.net's WordPress index.
  Ragebar.attach(document.getElementById('q'), {
    endpoint: 'https://rage.pythai.net/wp-json/wp/v2/search?per_page=8&search='
  });
</script>
