<!-- ragebar immersive v1.2.0 (rage.pythai.net) | GATERAGE/ragebar | 2026-10-22
     The header search, immersive: the magnifier, "/" or the /ragebar/ field opens a full-screen glass stage with
     the field at its centre. RAGE search (RAGESEARCH.md, ragesearch/1): the legs you choose run at once and are
     fused by rank (reciprocal rank fusion, k = 60), each saying whether it worked and how long it took.
     Adapted from Professor Codephreak's ultimate-input-field (github.com/Professor-Codephreak/ultimate-input-field),
     the field browseML is built on, with browseML's two conventions: T toggles the CONTROL PANEL (the RAGE
     variables: legs words · meaning · atlas · wordpress, corpus articles · RAGE's own · both, k; live
     diagnostics from the service's /health; STOP; CLEAR) and ❏ SPAWNS A RESPONSE WINDOW (the results of this
     question as a draggable window; ⌂ calls every window home). Commands in the field: :legs … :corpus … :k …
     :spawn :clear :help, with ↑/↓ history. Variables are remembered in this browser (localStorage ragebar_vars).
     RAGE is a MODE in the field's row of buttons (RAGE · atlas): in RAGE mode the control panel is the RAGE panel;
     atlas hands over to the rage menu's atlas. PERSONAS roll in under the field like a rolodex: RAGE (none), mindX
     and bankML are built in (their public .persona files), and any .persona dropped on the field rolls in beside
     them, read in this browser and kept here (localStorage ragebar_personas), never uploaded. The chosen persona
     adds a leg: what that persona holds (beliefs, skills, exchanges, each with its source) searched by BM25 here
     and fused with the rest. Every answer is announced on document as 'dv:rage' {query, legs, results} (the
     DeltaVerse event contract), which rage-substrate.js draws.
     DEVICES, each a button in the row and a control panel: 👁 turns the camera on and opens the camera.control.panel
     (preview, camera choice, mirror, and ollywoo's faicey face toolkit — presence, distance, head pose, expression —
     loaded from deltaverse.pythai.net on request); 👂 turns the microphone on and opens the audio.control.panel
     (microphone choice, level and scope, dictation into the field by the browser's recogniser, and voaicey speaking
     the answer in the chosen persona's voice); ⇄ opens networking.tools (round trips to every service RAGE uses, the
     legs' timings, the connection). Nothing turns on except by its own button; every panel has its OFF.
     ARTICLES RESPOND AS THE RAGE MENU'S TOP PICK DOES: a result that is a rage article opens in place — its excerpt,
     date, the voices that LISTEN reads it in, read →, ✵ kindred, ↔ its thread, its #tags, ◎ converge — and each spawns
     further articles beneath it. Opening one walks the TRAIL the rage menu keeps (sessionStorage ragemap_v1: the same
     trail, the same collected tags), so travel in the ragebar and in the menu is one journey. Enter opens the first
     article; Enter again reads it. On a substrate page (rage.html) a click on a star dispatches dv:rage.pick and the
     article opens here.
     JAIMLA'S FAICE: drag 👁 or 👂 out of the row (mouse or touch) and drop it on Jaimla's faice — ollywoo's faice.js,
     the BASIC FAICE whose organs are the devices. 👁 dropped: the camera turns on and IS her eyes (the live picture is
     the iris); 👂 dropped: the microphone turns on and her ears swell with what it hears; her mouth is the waveform of
     the voice speaking the answer (🗣, in Jaimla's voice). Click an eye or an ear for its control panel; drag the globe
     to turn it. Also from the ◉ on Jaimla's card in the rolodex, the eyes / ears buttons in the faice, or :face.
     three.js and faice.js load from deltaverse.pythai.net only when the faice is opened; nothing leaves the browser.
     Config: window.RAGEBAR={search, deltaverse, atlas, backdrop:'clear', typeToOpen, open, faice: () => [three, faice.js]}.
     DOM API only, no blank lines inside the script: content filters rewrite markup and blank lines. -->
