<!-- ragebar immersive v1.0.0 (rage.pythai.net) | GATERAGE/ragebar | 2026-10-22
     The header search, immersive: the magnifier, "/" or the /ragebar/ field opens a full-screen glass stage with
     the field at its centre. RAGE search (RAGESEARCH.md, ragesearch/1): the legs you choose run at once and are
     fused by rank (reciprocal rank fusion, k = 60), each saying whether it worked and how long it took.
     Adapted from Professor Codephreak's ultimate-input-field (github.com/Professor-Codephreak/ultimate-input-field),
     the field browseML is built on, with browseML's two conventions: T toggles the CONTROL PANEL (the RAGE
     variables: legs words · meaning · atlas · wordpress, corpus articles · RAGE's own · both, k; live
     diagnostics from the service's /health; STOP; CLEAR) and ❏ SPAWNS A RESPONSE WINDOW (the results of this
     question as a draggable window; ⌂ calls every window home). Commands in the field: :legs … :corpus … :k …
     :spawn :clear :help, with ↑/↓ history. Variables are remembered in this browser (localStorage ragebar_vars).
     RAGE is a MODE in the field's row of buttons (RAGE · atlas): in RAGE mode the control panel is the RAGE panel;
     atlas hands over to the rage menu's atlas. PERSONAS roll in under the field like a rolodex: RAGE (none), mindX
     and bankML are built in (their public .persona files), and any .persona dropped on the field rolls in beside
     them, read in this browser and kept here (localStorage ragebar_personas), never uploaded. The chosen persona
     adds a leg: what that persona holds (beliefs, skills, exchanges, each with its source) searched by BM25 here
     and fused with the rest. Every answer is announced on document as 'dv:rage' {query, legs, results} (the
     DeltaVerse event contract), which rage-substrate.js draws. Config: window.RAGEBAR={search}.
     DOM API only, no blank lines inside the script: content filters rewrite markup and blank lines. -->
<style id="ragebar-immersive-css">
:root{--ri-g:#3ddc84;--ri-hot:#ff3b30;--ri-amber:#ffb340;--ri-ink:#e9ffe9;--ri-dim:#86a492;--ri-line:#1f3a2b}

.ri.ri-open{display:block;animation:riIn .22s ease-out}
.ri.ri-closing{animation:riOut .18s ease-in forwards}

.ri-back{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 18%,rgba(18,40,28,.86),rgba(3,5,8,.96) 70%);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.ri-sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ri-stage{position:relative;height:100%;overflow-y:auto;padding:min(12vh,96px) 16px 48px;box-sizing:border-box}

.ri-field.ri-lit{border-color:var(--ri-g);box-shadow:0 0 0 1px rgba(61,220,132,.35),0 24px 70px rgba(0,0,0,.6),0 0 40px rgba(61,220,132,.22)}
.ri-field.ri-red{border-color:var(--ri-hot);box-shadow:0 0 0 1px rgba(255,59,48,.4),0 0 40px rgba(255,59,48,.22)}
.ri-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(61,220,132,.16);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ri-dim)}
.ri-dot{width:8px;height:8px;border-radius:50%;background:var(--ri-g);box-shadow:0 0 10px var(--ri-g)}
.ri-bar b{color:var(--ri-g);font-weight:700}
.ri-sp{flex:1}
.ri-dv{color:#bfe8d0!important;text-decoration:none!important;letter-spacing:.08em;text-transform:none;font-size:10.5px;white-space:nowrap}
.ri-dv:hover,.ri-dv:focus-visible{color:var(--ri-g)!important}
@media (max-width:600px){.ri-dv{display:none}}
.ri-btn{all:unset;cursor:pointer;padding:3px 8px;border:1px solid var(--ri-line);border-radius:7px;color:var(--ri-ink);font-size:11px;letter-spacing:.08em;text-transform:none}
.ri-btn:hover,.ri-btn:focus-visible{border-color:var(--ri-g);color:var(--ri-g)}

.ri-q{display:block;box-sizing:border-box;width:100%;height:64px;padding:0 18px;border:0;outline:0;background:transparent;color:var(--ri-ink);caret-color:var(--ri-g);font:inherit;font-size:22px}
.ri-q::placeholder{color:#6d8a78;opacity:1}
.ri-vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 12px 10px}

.ri-chip{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--ri-line);color:#bfe8d0;background:rgba(61,220,132,.04);user-select:none}
.ri-chip:hover,.ri-chip:focus-visible{border-color:var(--ri-g)}
.ri-chip[aria-pressed="true"]{background:rgba(61,220,132,.18);border-color:var(--ri-g);color:var(--ri-g)}

.ri-meter{display:flex;align-items:center;gap:10px;padding:0 14px 12px;font-size:11px;color:var(--ri-dim)}

.ri-pc b{display:block;font-size:12.5px;color:#eaf6ef;font-weight:600}
.ri-pc i{display:block;font-style:normal;font-size:10.5px;color:var(--ri-dim);line-height:1.35;max-height:2.7em;overflow:hidden}

.ri-panel h4{margin:8px 0 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ri-dim);font-weight:400}

.ri-win-body{overflow:auto;padding:8px;display:grid;gap:8px}
.ri-win .ri-card{padding:9px 12px}
.ri-win .ri-t{font-size:13.5px}

@media (prefers-reduced-motion:reduce){.ri.ri-open,.ri.ri-closing,.ri-card{animation:none}.ri-sparks{display:none}}
</style>

    var v=q.value.trim(), cmd=v.charAt(0)===':'||!v;
    if(e.key==='Enter'){ e.preventDefault(); if(!v) return; hist.push(v); hi=hist.length; if(v.charAt(0)===':'){ say('› '+v); command(v); q.value=''; return; }
      var a=list.querySelector('a'); if(a) location.href=a.href; }
    else if((e.key==='ArrowUp'||(e.key==='ArrowDown'&&cmd))&&cmd&&hist.length){ e.preventDefault(); hi=Math.max(0,Math.min(hist.length,hi+(e.key==='ArrowUp'?-1:1))); q.value=hist[hi]||''; }
    else if(e.key==='ArrowDown'){ var f=list.querySelector('a'); if(f){ e.preventDefault(); f.focus(); } } });
  list.addEventListener('keydown',function(e){ var L=Array.prototype.slice.call(list.querySelectorAll('a')), i=L.indexOf(document.activeElement); if(i<0) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); (L[i+1]||L[0]).focus(); } else if(e.key==='ArrowUp'){ e.preventDefault(); if(i===0) q.focus(); else L[i-1].focus(); } });
  window.RagebarImmersive={open:open,close:close,spawn:spawn,home:home,version:VERSION,vars:V};
})();
</script>
